<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nina Fit">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Nina Fit</title>
</head>
<body data-area="home">
<main id="view" aria-live="polite"></main>

<button id="mini" hidden data-action="wk-resume" aria-label="Resume workout">
  <span class="mini-dot"></span>
  <span id="mini-name"></span>
  <span id="mini-time"></span>
  <span class="mini-go">Resume</span>
</button>

<nav id="tabbar" aria-label="Main">
  <button class="tab" data-action="tab" data-tab="home">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span>Home</span>
  </button>
  <button class="tab" data-action="tab" data-tab="train">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="7" x2="7" y2="17"/><line x1="17" y1="7" x2="17" y2="17"/><line x1="3.5" y1="9.5" x2="3.5" y2="14.5"/><line x1="20.5" y1="9.5" x2="20.5" y2="14.5"/></svg>
    <span>Train</span>
  </button>
  <div class="fab-slot">
    <button id="fab" data-action="quick" aria-label="Quick add">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
  <button class="tab" data-action="tab" data-tab="food">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 4 0V3"/><line x1="9" y1="12" x2="9" y2="21"/><path d="M17 21V3c-2 1.5-3 4-3 7 0 1.5 1 2.5 3 2.5"/></svg>
    <span>Food</span>
  </button>
  <button class="tab" data-action="tab" data-tab="progress">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="15 6 21 6 21 12"/></svg>
    <span>Progress</span>
  </button>
</nav>

<div id="workout" hidden></div>
<div id="scan" hidden></div>
<div id="sheet-root"></div>
<div id="intro" hidden></div>
<div id="toast" role="status"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<input id="photo-file" type="file" accept="image/*" capture="environment" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
